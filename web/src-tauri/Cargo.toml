[package]
name = "nithya-studio"
version = "0.1.0"
description = "Nithya Studio: the Tauri reference shell for the Nithya design framework"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "nithya_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
